<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
   --bg:#0a0b0d;
--bg-2:#0f1113;
--blue:#5EC8FF;
--blue-dim: rgba(94,200,255,0.14);
--text:#f2f3f0;
--text-dim:#8a8f92;
--border: rgba(94,200,255,0.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ambient grid + glow backdrop */
  .grid-bg{
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(94,200,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94,200,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 20%, transparent 75%);
    pointer-events:none;
    z-index:0;
  }
  .glow{
    position:fixed;
    top:-20%;
    left:50%;
    transform:translateX(-50%);
    width:900px;
    height:900px;
    background: radial-gradient(circle, rgba(94,200,255,0.10) 0%, transparent 60%);
    pointer-events:none;
    z-index:0;
    animation: drift 12s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ transform:translateX(-50%) translateY(0); }
    50%{ transform:translateX(-50%) translateY(30px); }
  }

  .wrap{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:80px 24px 60px;
  }

  .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--blue);
    opacity:0;
    animation: fadeUp .7s .1s cubic-bezier(.16,1,.3,1) forwards;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before, .eyebrow::after{
    content:'';
    width:22px;
    height:1px;
    background:var(--border);
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(40px, 8vw, 76px);
    letter-spacing:-2px;
    text-align:center;
    line-height:1;
    opacity:0;
    animation: fadeUp .8s .2s cubic-bezier(.16,1,.3,1) forwards;
  }
  h1 span{
    color:var(--blue);
    text-shadow: 0 0 30px rgba(94,200,255,0.45);
  }

  .subtitle{
    margin-top:16px;
    font-size:15px;
    color:var(--text-dim);
    text-align:center;
    max-width:480px;
    opacity:0;
    animation: fadeUp .8s .32s cubic-bezier(.16,1,.3,1) forwards;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .cards{
    margin-top:64px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:28px;
    width:100%;
    max-width:820px;
  }

  .card{
    position:relative;
    display:block;
    text-decoration:none;
    color:var(--text);
    background: linear-gradient(160deg, var(--bg-2), #0a0a0a);
    border:2px solid var(--border);
    border-radius:18px;
    padding:40px 28px 32px;
    aspect-ratio: 4 / 5;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    overflow:hidden;
    opacity:0;
    transform:translateY(30px);
    transition: border-color .4s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1), box-shadow .5s;
  }
  .card:nth-child(1){ animation: fadeUp .8s .48s cubic-bezier(.16,1,.3,1) forwards; }
  .card:nth-child(2){ animation: fadeUp .8s .58s cubic-bezier(.16,1,.3,1) forwards; }

  .card:hover{
    transform: translateY(-10px);
    border-color: var(--blue);
    box-shadow: 0 30px 70px rgba(94,200,255,0.12), 0 0 0 1px rgba(94,200,255,0.15) inset;
  }

  .card::before{
    content:'';
    position:absolute;
    top:-40%;
    right:-40%;
    width:70%;
    height:70%;
    background: radial-gradient(circle, rgba(94,200,255,0.10), transparent 70%);
    transition: opacity .4s;
    opacity:0;
  }
  .card:hover::before{ opacity:1; }

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    position:relative;
    z-index:1;
  }
  .card-index{
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:1px;
  }
  .card-arrow{
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--blue);
    transition: transform .4s cubic-bezier(.16,1,.3,1), background .3s;
    flex-shrink:0;
  }
  .card:hover .card-arrow{
    transform: rotate(45deg);
    background: var(--blue-dim);
  }

  .card-icon{
    width:100%;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:1;
  }
  .card-icon svg{
    width:96px;
    height:96px;
    stroke:var(--blue);
    transition: transform .6s cubic-bezier(.16,1,.3,1), filter .4s;
    filter: drop-shadow(0 0 0 rgba(94,200,255,0));
  }
  .card:hover .card-icon svg{
    transform: scale(1.08) translateY(-4px);
    filter: drop-shadow(0 0 18px rgba(94,200,255,0.35));
  }
  /* subtle idle rotation for the 3d cube icon */
  .card.art .card-icon svg{ animation: spin 9s linear infinite; }
  @keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .card.art:hover .card-icon svg{ animation-play-state: paused; }

  .card-bottom{
    position:relative;
    z-index:1;
  }
  .card-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:-0.5px;
  }
  .card-desc{
    margin-top:8px;
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.5;
  }

  footer{
    position:relative;
    z-index:1;
    margin-top:56px;
    font-size:11.5px;
    color:#3f453e;
    text-align:center;
    opacity:0;
    animation: fadeUp .8s .8s cubic-bezier(.16,1,.3,1) forwards;
  }

  @media (max-width:640px){
    .cards{ grid-template-columns:1fr; max-width:340px; }
    .card{ aspect-ratio:auto; padding:28px 22px; }
    .card-icon svg{ width:76px; height:76px; }
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="glow"></div>

<div class="wrap">
  <div class="eyebrow">Portfolio</div>
  <h1>MR</h1>
  <p class="subtitle">Choose a direction — 3D modeling of game assets or developing and customizing Shopify stores.</p>

  <div class="cards">
    <a class="card shop" href="shopify.html">
      <div class="card-top">
        <span class="card-index"></span>
        <span class="card-arrow">↗</span>
      </div>
      <div class="card-icon">
        <svg viewBox="0 0 64 64" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 20 L20 10 H44 L48 20"/>
          <path d="M12 20 H52 L49 54 H15 L12 20 Z"/>
          <path d="M24 28 C24 33 27 36 32 36 C37 36 40 33 40 28"/>
        </svg>
      </div>
      <div class="card-bottom">
        <div class="card-title">Shopify</div>
        <div class="card-desc">Themes, page customization, store settings</div>
      </div>
    </a>

    <a class="card art" href="3d-art.html">
      <div class="card-top">
        <span class="card-index"></span>
        <span class="card-arrow">↗</span>
      </div>
      <div class="card-icon">
        <svg viewBox="0 0 64 64" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M32 6 L56 19 V45 L32 58 L8 45 V19 Z"/>
          <path d="M8 19 L32 32 L56 19"/>
          <path d="M32 32 V58"/>
        </svg>
      </div>
      <div class="card-bottom">
        <div class="card-title">3D Art</div>
        <div class="card-desc">Stylized low-poly assets for games</div>
      </div>
    </a>
  </div>

  <footer>© 2026 MR · Ukraine</footer>
</div>

</body>
</html>
